version: "3.8"
services: 
  backend:
    container_name: Gaas
    build: .
    environment:
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    depends_on:
      -  postgres
    
  postgres:
    container_name: postgres_gaas
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    
  test:
    container_name: testpostgres_gaas
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tests
    ports:
      - "5433:5432"



volumes:
  db-data:
